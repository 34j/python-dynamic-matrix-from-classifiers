name: Python dynamic matrix from classifiers
description: Extract supported Python versions and operating systems from pyproject.toml classifiers for a GitHub Actions matrix.
author: 34j

inputs:
  pyproject-path:
    description: Path to the pyproject.toml file to inspect.
    required: false
    default: pyproject.toml

outputs:
  versions:
    description: JSON array of Python versions extracted from classifiers.
    value: ${{ steps.extract.outputs.versions }}
  oses:
    description: JSON array of GitHub Actions runners extracted from operating system classifiers.
    value: ${{ steps.extract.outputs.oses }}

runs:
  using: composite
  steps:
    - id: extract
      shell: bash
      run: python "$GITHUB_ACTION_PATH/extract.py" "${{ inputs['pyproject-path'] }}" >> "$GITHUB_OUTPUT"

branding:
  icon: grid
  color: blue
